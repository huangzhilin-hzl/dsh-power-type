<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-power-type preview</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f17;
    --panel: #111827;
    --card: #151d2e;
    --line: rgba(255,255,255,.08);
    --text: #e8eefc;
    --muted: #8b98b3;
    --accent: #4d93f8;
    --dsw-alias-state-business-primary: #4d93f8;
    --dsw-alias-brand-primary-new-colorprimary-new-color: #7aaaff;
    --dsw-static-amber-400: #f7ad31;
    --dsw-static-red-400: #f25a5a;
    --dsw-static-green-400: #4ed17e;
    --dsw-alias-label-primary: #e8eefc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #16213a 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    overflow: hidden;
  }
  .app { display: flex; height: 100%; }
  .sidebar {
    width: 248px; padding: 18px 14px; border-right: 1px solid var(--line);
    background: rgba(9,13,21,.72); backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; margin-bottom: 24px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #2b6ef2, #0b1b3a);
    box-shadow: inset 0 0 0 1px rgba(143,184,255,.45), 0 0 18px rgba(77,147,248,.35);
    display: grid; place-items: center; font-size: 14px;
  }
  .side-item { padding: 8px 10px; border-radius: 9px; color: var(--muted); margin: 2px 0; }
  .side-item.active { background: rgba(77,147,248,.14); color: #cfe0ff; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .conversation { flex: 1; overflow: hidden; padding: 42px 7vw 0; }
  .conversation h1 { font-size: 22px; margin: 0 0 6px; font-weight: 650; }
  .conversation p { color: var(--muted); margin: 0 0 22px; }
  .bubble {
    max-width: 660px; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 14px; background: rgba(255,255,255,.025); color: #cdd8ee; margin-bottom: 12px;
  }
  .bubble.user { margin-left: auto; background: rgba(77,147,248,.1); border-color: rgba(77,147,248,.22); color: #dce9ff; }
  .composer-wrap { padding: 0 7vw 34px; }
  .composer {
    position: relative; width: 100%; max-width: 820px; margin: 0 auto;
    background: var(--card); border-radius: 26px; padding: 14px 16px 12px;
    box-shadow: 0 24px 70px rgba(0,0,0,.35), 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.04);
    font-size: 17px; line-height: 28px;
  }
  .editor {
    min-height: 56px; max-height: 196px; overflow: auto; outline: none;
    white-space: pre-wrap; word-break: break-word; color: var(--text); padding: 2px 4px;
    caret-color: var(--accent);
  }
  .editor:empty::before { content: "输入消息，体验打字打击感…"; color: #6f7d99; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px;
    color: var(--muted); font-size: 12px; background: rgba(255,255,255,.02);
  }
  .send {
    margin-left: auto; width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(180deg, #5aa0ff, #2f6fdd); box-shadow: 0 6px 18px rgba(47,111,221,.4);
    display: grid; place-items: center; color: white; font-size: 16px;
  }
  .hint { max-width: 820px; margin: 10px auto 0; color: #66748f; font-size: 12px; text-align: center; }
  [data-shell-overlay] { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  #stats {
    position: fixed; left: 18px; bottom: 16px; z-index: 30;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #6d7d9c; background: rgba(9,13,21,.72); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; white-space: pre;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">⚡</span>DeepSeek Harness</div>
    <div class="side-item active">新建会话</div>
    <div class="side-item">工作区文件</div>
    <div class="side-item">插件</div>
    <div class="side-item">设置</div>
  </aside>
  <main class="main">
    <section class="conversation">
      <h1>让每一次敲击都有回响</h1>
      <p>下面是一个模拟的 DSH 输入框，插件正在监听真实的 input 事件。</p>
      <div class="bubble">粒子、字符冲击波、输入框震动和连击计数会在输入时同时出现。</div>
      <div class="bubble user">参考 IntelliJ 的 Power Mode：打字不只是显示文字，还要有打击感。</div>
      <div class="bubble">继续输入，连击数会在输入框右上角累加。</div>
    </section>
    <div class="composer-wrap">
      <div class="composer" data-composer-card>
        <div class="editor" data-composer-input contenteditable="true" role="textbox" aria-multiline="true" spellcheck="false"></div>
        <div class="row">
          <span class="chip">＋</span>
          <span class="chip">权限</span>
          <span class="chip">计划</span>
          <span class="chip">dsv41-flash</span>
          <span class="send">↑</span>
        </div>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · 输入时触发特效</div>
    </div>
  </main>
  <div data-shell-overlay></div>
</div>
<div id="stats">booting…</div>

<script>
  // A tiny React stand-in: the plugin only uses createElement and a ref callback.
  const React = {
    createElement(type, props) {
      const element = document.createElement(type)
      const ref = props && props.ref
      if (props) {
        for (const [key, value] of Object.entries(props)) {
          if (key === 'ref') continue
          if (key === 'style') Object.assign(element.style, value)
          else if (key === 'className') element.className = value
          else element.setAttribute(key, String(value))
        }
      }
      return { element, ref }
    },
  }
  window.__ModuleLoader__ = {
    load({ factory }) {
      window.__powerTypeModule = factory((name) => {
        if (name === 'react') return React
        throw new Error('unexpected module ' + name)
      })
    },
  }
</script>
<script src="../client.js"></script>
<script>
  const overlay = document.querySelector('[data-shell-overlay]')
  let registration = null
  const ctx = {
    slots: {
      inject(name, contribute) {
        if (name !== 'shell.overlay') throw new Error('unexpected slot ' + name)
        contribute()
      },
      register(options, component) {
        registration = { options, component }
        return () => {}
      },
    },
  }
  window.__powerTypeModule.apply(ctx)
  const vnode = registration.component()
  overlay.append(vnode.element)
  if (vnode.ref) vnode.ref(vnode.element)

  const editor = document.querySelector('[data-composer-input]')
  // Lexical stops input propagation in its own handler; the plugin listens in capture phase.
  editor.addEventListener('input', (event) => event.stopPropagation())
  editor.addEventListener('keydown', (event) => event.stopPropagation())
  const stats = document.getElementById('stats')
  const sample = '打字也可以有打击感。Power Mode 的爽点在于粒子、屏幕震动和 Combo。'
  const params = new URLSearchParams(location.search)
  const stepMs = Number(params.get('speed') ?? 120)
  const freezeAfter = Number(params.get('freeze') ?? 0)
  let index = 0
  let sent = 0

  function placeCaret() {
    const range = document.createRange()
    range.selectNodeContents(editor)
    range.collapse(false)
    const selection = getSelection()
    selection.removeAllRanges()
    selection.addRange(range)
  }

  function typeOne() {
    const char = sample[index % sample.length]
    editor.textContent += char
    placeCaret()
    editor.dispatchEvent(new InputEvent('input', {
      bubbles: true,
      inputType: 'insertText',
      data: char,
    }))
    index += 1
    if (index % 34 === 0) {
      editor.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
      sent += 1
      setTimeout(() => {
        editor.textContent = ''
        index = 0
        placeCaret()
      }, 120)
    }
    if (freezeAfter > 0 && index >= freezeAfter) {
      if (params.get('burst') === '1') setTimeout(() => window.__dshPowerType?.burst(), 80)
      return
    }
    setTimeout(typeOne, index === 0 ? 700 : stepMs)
  }

  window.addEventListener('error', (event) => {
    stats.textContent = 'ERROR: ' + event.message + '\n' + (event.error && event.error.stack ? event.error.stack : '')
  })
  let rafCount = 0
  requestAnimationFrame(function count() { rafCount += 1; requestAnimationFrame(count) })
  setInterval(() => { stats.dataset.raf = String(rafCount) }, 100)

  editor.focus()
  placeCaret()
  setTimeout(typeOne, 260)

  setInterval(() => {
    const api = window.__dshPowerType
    if (!api) {
      stats.textContent = 'plugin api not ready'
      return
    }
    const state = api.stats()
    stats.textContent = [
      'dsh-power-type',
      'enabled   ' + state.enabled,
      'intensity ' + state.intensity,
      'combo     ' + state.combo,
      'particles ' + state.particles,
      'waves     ' + state.waves,
      'ghosts    ' + state.ghosts,
      'sent      ' + sent,
      'raf       ' + (stats.dataset.raf || '0'),
    ].join('\n')
  }, 80)
</script>
</body>
</html>
